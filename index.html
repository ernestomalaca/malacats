<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MALACATS COMICS</title>

  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #18181b;
      --card-bg: #fffdf2;
      --accent: #facc15;
      --ink: #27272a;
      --text: #3f3f46;
    }
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg-dark);
      background-image: radial-gradient(#3f3f46 2px, transparent 2px);
      background-size: 24px 24px;
      color: var(--ink);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      width: 100%;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 3px solid var(--accent);
      padding: 1.2rem 1rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-sizing: border-box;
    }
    .brand {
      font-family: 'Patrick Hand', cursive;
      font-size: 2.5rem;
      color: var(--accent);
      margin: 0;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0px var(--ink);
    }
    .feed-container {
      width: 100%;
      max-width: 650px; 
      padding: 3rem 1.5rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 4rem; 
    }
    .comic-post {
      background: var(--card-bg);
      border: 4px solid var(--ink);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 10px 10px 0px var(--accent);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: transform 0.2s ease;
    }
    .comic-post:hover {
      transform: translateY(-4px);
    }
    .single-img {
      width: 100%;
      height: auto;
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-sizing: border-box;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
    }
    .carousel-container {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 1rem;
      padding-bottom: 1rem; 
      -ms-overflow-style: none;  
      scrollbar-width: thin;  
    }
    .carousel-container::-webkit-scrollbar { height: 10px; }
    .carousel-container::-webkit-scrollbar-track {
      background: #f4f4f5;
      border-radius: 8px;
      border: 2px solid var(--ink);
    }
    .carousel-container::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 8px;
      border: 2px solid var(--ink);
    }
    .carousel-item {
      flex: 0 0 100%; 
      scroll-snap-align: center;
    }
    .carousel-item img {
      width: 100%;
      height: auto;
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-sizing: border-box;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
    }
    .swipe-hint {
      font-size: 0.9rem;
      color: #71717a;
      font-weight: 700;
      text-align: right;
      margin-top: 0.5rem;
    }
    .loader {
      text-align: center;
      font-family: 'Patrick Hand', cursive;
      color: var(--card-bg);
      font-size: 1.8rem;
      padding: 3rem;
      background: var(--ink);
      border-radius: 16px;
      border: 3px solid var(--accent);
    }
  </style>
</head>
