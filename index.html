<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MALACATS // Cómic Feed</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #09090b;
      --panel-dark: #18181b;
      --border: #27272a;
      --accent: #facc15;
      --ink: #18181b;
      --sheet-bg: #fef08a;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: #f4f4f5;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      background: var(--panel-dark);
      border-bottom: 2px solid var(--border);
      padding: 1rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      font-family: 'Patrick Hand', cursive;
      font-size: 2rem;
      color: var(--accent);
      margin: 0;
    }
    .feed-container {
      width: 100%;
      max-width: 600px; /* Tamaño ideal para simular el feed de móvil */
      padding: 2rem 1rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 3rem;
    }
    .comic-post {
      background: var(--sheet-bg);
      border: 4px solid var(--ink);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 6px 6px 0 rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .post-title {
      font-family: 'Patrick Hand', cursive;
      color: var(--ink);
      font-size: 1.5rem;
      margin: 0 0 0.5rem 0;
      font-weight: 700;
      text-transform: uppercase;
    }
    /* Estilos para Tira Única */
    .single-img {
      width: 100%;
      height: auto;
      border: 3px solid var(--ink);
      border-radius: 8px;
      box-sizing: border-box;
    }
    /* Estilos para Carrusel (Scroll Horizontal nativo) */
    .carousel-container {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 1rem;
      padding-bottom: 1rem; /* Espacio para la barra de scroll */
      -ms-overflow-style: none;  /* IE y Edge */
      scrollbar-width: thin;  /* Firefox */
    }
    .carousel-container::-webkit-scrollbar {
      height: 8px;
    }
    .carousel-container::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
      border-radius: 4px;
    }
    .carousel-container::-webkit-scrollbar-thumb {
      background: var(--ink);
      border-radius: 4px;
    }
    .carousel-item {
      flex: 0 0 100%; /* Cada imagen ocupa el 100% del ancho del contenedor */
      scroll-snap-align: start;
    }
    .carousel-item img {
      width: 100%;
      height: auto;
      border: 3px solid var(--ink);
      border-radius: 8px;
      box-sizing: border-box;
    }
    .loader {
      text-align: center;
      font-family: 'Patrick Hand', cursive;
      color: var(--accent);
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="brand">🐾 MALACATS COMICS</h1>
  </div>

  <div class="feed-container" id="feed">
    <div class="loader" id="loader">Buscando nuevos cómics de Ceniza y Pandorito... 😸</div>
  </div>

  <script>
    // --- CONFIGURACIÓN IMPORTANTE ---
    // Cambia esto por tu usuario y el nombre de tu repositorio
    const githubUser = 'ernestomalaca'; 
    const githubRepo = 'malacats';
    const folderName = 'malacats';
    
    // URL de la API de GitHub para leer la carpeta
    const apiUrl = `https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${folderName}`;

    async function loadComics() {
      const feedContainer = document.getElementById('feed');
      const loader = document.getElementById('loader');

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('No se pudo conectar con GitHub.');
        
        const files = await response.json();
        
        // Agrupar archivos por su nombre base (ej. tira1, tira2)
        const comicsGrouped = {};

        files.forEach(file => {
          // Solo procesar jpg o png
          if (file.name.match(/\.(jpe?g|png)$/i)) {
            // Extraer el nombre base ignorando la letra final (a, b, c) y la extensión
            // Ej: tira2a.jpg -> match[1] = "tira2"
            const match = file.name.match(/^(tira\d+)[a-z]?\.(jpg|png|jpeg)$/i);
            
            if (match) {
              const baseName = match[1].toLowerCase();
              if (!comicsGrouped[baseName]) {
                comicsGrouped[baseName] = [];
              }
              // Guardar la URL directa a la imagen
              comicsGrouped[baseName].push({
                name: file.name,
                url: file.download_url
              });
            }
          }
        });

        // Ordenar los grupos alfabéticamente (para que tira10 no salga antes que tira2 si no queremos, 
        // aunque lo ideal es orden numérico inverso para que lo más nuevo salga arriba)
        const sortedKeys = Object.keys(comicsGrouped).sort((a, b) => {
          const numA = parseInt(a.replace('tira', ''));
          const numB = parseInt(b.replace('tira', ''));
          return numB - numA; // Orden descendente (más nuevos arriba)
        });

        loader.style.display = 'none';

        // Construir el HTML
        sortedKeys.forEach(key => {
          const group = comicsGrouped[key];
          
          // Ordenar las imágenes dentro del grupo alfabéticamente (tira2a, tira2b...)
          group.sort((a, b) => a.name.localeCompare(b.name));

          const postEl = document.createElement('div');
          postEl.className = 'comic-post';
          
          const titleEl = document.createElement('h2');
          titleEl.className = 'post-title';
          titleEl.innerText = key.toUpperCase(); // Ej: "TIRA 2"
          postEl.appendChild(titleEl);

          if (group.length === 1) {
            // Tira única
            const img = document.createElement('img');
            img.src = group[0].url;
            img.className = 'single-img';
            postEl.appendChild(img);
          } else {
            // Carrusel
            const carousel = document.createElement('div');
            carousel.className = 'carousel-container';
            
            group.forEach(item => {
              const slide = document.createElement('div');
              slide.className = 'carousel-item';
              const img = document.createElement('img');
              img.src = item.url;
              slide.appendChild(img);
              carousel.appendChild(slide);
            });
            postEl.appendChild(carousel);
          }

          feedContainer.appendChild(postEl);
        });

        if (sortedKeys.length === 0) {
          feedContainer.innerHTML = '<div class="loader">Aún no hay cómics en la carpeta 😿</div>';
        }

      } catch (error) {
        loader.innerText = 'Oops! Hubo un error al cargar los cómics.';
        console.error(error);
      }
    }

    // Iniciar al cargar la página
    document.addEventListener('DOMContentLoaded', loadComics);
  </script>
</body>
</html>
