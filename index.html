<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MALACATS COMICS</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #18181b;
      --card-bg: #fffdf2;
      --accent: #facc15;
      --ink: #27272a;
      --text: #3f3f46;
    }
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg-dark);
      background-image: radial-gradient(#3f3f46 2px, transparent 2px);
      background-size: 24px 24px;
      color: var(--ink);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      width: 100%;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 3px solid var(--accent);
      padding: 1.2rem 1rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-sizing: border-box;
    }
    .brand {
      font-family: 'Patrick Hand', cursive;
      font-size: 2.5rem;
      color: var(--accent);
      margin: 0;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0px var(--ink);
    }
    .feed-container {
      width: 100%;
      max-width: 650px; 
      padding: 3rem 1.5rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 4rem; 
    }
    .comic-post {
      background: var(--card-bg);
      border: 4px solid var(--ink);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 10px 10px 0px var(--accent);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: transform 0.2s ease;
    }
    .comic-post:hover {
      transform: translateY(-4px);
    }
    .single-img {
      width: 100%;
      height: auto;
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-sizing: border-box;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
    }
    .carousel-container {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 1rem;
      padding-bottom: 1rem; 
      -ms-overflow-style: none;  
      scrollbar-width: thin;  
    }
    .carousel-container::-webkit-scrollbar { height: 10px; }
    .carousel-container::-webkit-scrollbar-track {
      background: #f4f4f5;
      border-radius: 8px;
      border: 2px solid var(--ink);
    }
    .carousel-container::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 8px;
      border: 2px solid var(--ink);
    }
    .carousel-item {
      flex: 0 0 100%; 
      scroll-snap-align: center;
    }
    .carousel-item img {
      width: 100%;
      height: auto;
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-sizing: border-box;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
    }
    .swipe-hint {
      font-size: 0.9rem;
      color: #71717a;
      font-weight: 700;
      text-align: right;
      margin-top: 0.5rem;
    }
    .loader {
      text-align: center;
      font-family: 'Patrick Hand', cursive;
      color: var(--card-bg);
      font-size: 1.8rem;
      padding: 3rem;
      background: var(--ink);
      border-radius: 16px;
      border: 3px solid var(--accent);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="brand">🐾 MALACATS</h1>
  </div>

  <div class="feed-container" id="feed">
    <div class="loader" id="loader">Buscando en el estudio... 🎹🐾</div>
  </div>

  <script>
    // --- CONFIGURACIÓN ---
    const githubUser = 'ernestomalaca'; 
    const githubRepo = 'malacats';
    const folderName = 'malacats'; 
    
    const apiUrl = `https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${folderName}`;

    async function loadComics() {
      const feedContainer = document.getElementById('feed');
      const loader = document.getElementById('loader');

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('No se pudo conectar con GitHub.');
        
        const files = await response.json();
        const comicsGrouped = {};

        files.forEach(file => {
          if (file.name.match(/\.(jpe?g|png)$/i)) {
            const match = file.name.match(/^(tira\d+)[a-z]?\.(jpg|png|jpeg)$/i);
            if (match) {
              const baseName = match[1].toLowerCase();
              if (!comicsGrouped[baseName]) {
                comicsGrouped[baseName] = [];
              }
              comicsGrouped[baseName].push({
                name: file.name,
                url: file.download_url
              });
            }
          }
        });

        // Ordenar descendentemente
        const sortedKeys = Object.keys(comicsGrouped).sort((a, b) => {
          const numA = parseInt(a.replace('tira', ''));
          const numB = parseInt(b.replace('tira', ''));
          return numB - numA; 
        });

        loader.style.display = 'none';

        sortedKeys.forEach(key => {
          const group = comicsGrouped[key];
          group.sort((a, b) => a.name.localeCompare(b.name));

          const postEl = document.createElement('div');
          postEl.className = 'comic-post';

          if (group.length === 1) {
            // Tira única (sin título repetitivo, solo la imagen)
            const img = document.createElement('img');
            img.src = group[0].url;
            img.className = 'single-img';
            img.loading = "lazy";
            postEl.appendChild(img);
          } else {
            // Carrusel
            const carousel = document.createElement('div');
            carousel.className = 'carousel-container';
            
            group.forEach(item => {
              const slide = document.createElement('div');
              slide.className = 'carousel-item';
              const img = document.createElement('img');
              img.src = item.url;
              img.loading = "lazy";
              slide.appendChild(img);
              carousel.appendChild(slide);
            });
            postEl.appendChild(carousel);
            
            const hintEl = document.createElement('div');
            hintEl.className = 'swipe-hint';
            hintEl.innerText = 'Desliza para leer 👉';
            postEl.appendChild(hintEl);
          }

          feedContainer.appendChild(postEl);
        });

        if (sortedKeys.length === 0) {
          feedContainer.innerHTML = '<div class="loader">Aún no hay cómics en la carpeta 😿</div>';
        }

      } catch (error) {
        loader.innerText = 'Oops! Hubo un error al cargar los cómics.';
        console.error(error);
      }
    }

    document.addEventListener('DOMContentLoaded', loadComics);
  </script>
</body>
</html>
